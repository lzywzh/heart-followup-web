# Local development database only. Run init-dev-env.mjs before starting.
services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hf_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate a private .env first}
      POSTGRES_DB: heart_followup_v2
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/dev/001-test-database.sql:/docker-entrypoint-initdb.d/001-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
